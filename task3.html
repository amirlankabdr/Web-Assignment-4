<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserve a table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="cafe-page">
  <main class="container py-4 py-md-5">
    <section class="form-card mx-auto">
      <header class="card-heading">
        <h1>Reserve a table</h1>
      </header>

      <form action="task3.html" method="get" class="card-body">
        <p class="intro">Choose a day and join us for lunch or dinner.</p>

        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label for="name" class="form-label">Your name</label>
            <input type="text" class="form-control" id="name" name="name"
                   autocomplete="name" required>
          </div>

          <div class="col-12 col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email"
                   autocomplete="email" required>
          </div>

          <div class="col-12 col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone" name="phone"
                   autocomplete="tel" required>
          </div>

          <div class="col-12 col-md-6">
            <label for="guests" class="form-label">Guests</label>
            <input type="number" class="form-control" id="guests" name="guests"
                   min="1" step="1" required>
          </div>

          <div class="col-12 col-md-6">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>

          <div class="col-12 col-md-6">
            <label for="meal" class="form-label">Meal</label>
            <select class="form-select" id="meal" name="meal" required>
              <option value="">Choose...</option>
              <option value="lunch">Lunch</option>
              <option value="dinner">Dinner</option>
            </select>
          </div>

          <fieldset class="col-12">
            <legend>Seating</legend>

            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="seating"
                     id="inside" value="inside" required>
              <label class="form-check-label" for="inside">Inside</label>
            </div>

            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="seating"
                     id="terrace" value="terrace" required>
              <label class="form-check-label" for="terrace">Terrace</label>
            </div>
          </fieldset>

          <div class="col-12">
            <label for="comments" class="form-label">Comments (optional)</label>
            <textarea class="form-control" name="comments" id="comments" rows="4"></textarea>
          </div>

          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="terms"
                     name="terms" value="agreed" required>
              <label class="form-check-label" for="terms">I agree to the terms</label>
            </div>
          </div>

          <div class="col-12">
            <button type="submit" class="btn main-button">Reserve</button>
          </div>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
